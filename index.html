<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불의 수정 계산기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .highlight {
            color: #FF6600;
        }
        .made-by {
            font-size: 12px;
            color: gray;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            padding: 5px;
            font-size: 16px;
            width: 80%;
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #FF6600;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>
            <span class="highlight">불의 수정</span> 계산기
            <small class="made-by">made by 1685 of DOHOON</small>
        </h2>

        <label for="num1">현재 불의 수정 단계</label>
        <input type="number" id="num1" placeholder="0~4 입력" min="0" max="4">

        <label for="num2">목표 불의 수정 단계</label>
        <input type="number" id="num2" placeholder="1~5 입력" min="1" max="5">

        <button onclick="calculateSum()">계산하기</button>
        <div id="result"></div>
    </div>

    <script>
        function calculateSum() {
            // 첫 번째 숫자의 변환 값 매핑
            const mapping = [660, 790, 1190, 1400, 1675];

            // 입력값 가져오기
            let num1 = parseInt(document.getElementById("num1").value);
            let num2 = parseInt(document.getElementById("num2").value);

            // 입력값 검증
            if (isNaN(num1) || num1 < 0 || num1 > 4) {
                document.getElementById("result").innerText = "현재 불의 수정 단계는 0~4만 입력하세요!";
                return;
            }
            if (isNaN(num2) || num2 < 1 || num2 > 5) {
                document.getElementById("result").innerText = "목표 불의 수정 단계는 1~5만 입력하세요!";
                return;
            }

            // 차이 계산
            let diff = Math.abs(num2 - num1);

            // 차이만큼 변환된 값 합산
            let sum = 0;
            let calculationSteps = "";
            for (let i = 0; i <= diff && (num1 + i) < mapping.length; i++) {
                let currentValue = mapping[num1 + i];
                sum += currentValue;
                calculationSteps += (i === 0 ? `${currentValue}` : ` + ${currentValue}`);
            }

            // 결과 표시
            document.getElementById("result").innerText = `계산 과정: ${calculationSteps} = ${sum}`;
        }
    </script>
</body>
</html>
